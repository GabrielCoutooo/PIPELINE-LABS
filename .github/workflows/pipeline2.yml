name: Hello Github Actions
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
jobs:
    heloo-job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Código
              uses: actions/checkout@v4
            - name: Executar Hello World
              run: echo "Hello Github Actions"
            - name: Mostrar informações do Sistema
              run: |
                echo "Sistema Operacional: ${{ runner.os }}"
                echo "Versão do Sistema: ${{ runner.arch }}"
                echo "Nome do Runner: ${{ runner.name }}"
                echo "Diretório Atual:" $(pwd)
                echo "Data e Hora:" $(date)
                echo "Usuário:" $(whoami)

            - name: Listar Arquivos do Repositório
              run: |
                echo "Arquivos no Repositório:"
                ls -la
            - name: Comandos Múltiplos
              run: |
                echo "Executando múltiplos comandos"
                echo "Primeiro comando"
                echo "Segundo comando"
                echo "Terceiro comando"