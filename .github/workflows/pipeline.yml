name: "Estrutura de diretórios e Arquivos"

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    NODE_VERSION: '18'

jobs:
    demonstrando-estrutura:
        name: "Demonstrar Estrutura Básica"
        runs-on: ubuntu-latest

        steps:
            - name: "Checkout do Código"
              uses: actions/checkout@v4

            - name: "Mostrar estrutura .github/workflows"
              run: |
                echo " === Estrutura de Diretórios e Arquivos .github/workflows ==="
                ls -la .github/workflows
                echo ""
                echo " Total de Workflows: $(ls -1 .github/workflows | wc -l)"

            - name: "Elementos obrigatórios do Workflow"
              run: |
                echo " === Elementos Obrigatórios do Workflow ==="
                echo "1. name: Nome do Workflow"
                echo "2. on: Eventos que disparam o Workflow"
                echo "3. jobs: Conjunto de trabalhos a serem executados"
                echo "4. runs-on: Ambiente onde o job será executado"
                echo "5. steps: Passos dentro de cada trabalho"
                echo ""
                echo "Total de elementos obrigatórios: 5"
                
            - name: "=== Variáveis e Contexto ==="
              run: |
                echo " === Variáveis e Contexto ==="
                echo "Variáveis env: ${{ env.NODE_VERSION }}"
                echo "1. env: Define variáveis de ambiente"
                echo "2. context: Acessa informações do workflow, job e steps"
                echo ""
                echo "Total de elementos de variáveis e contexto: 2"
